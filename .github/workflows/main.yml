name: MacRDP-Tailscale
on: 
  workflow_dispatch:

jobs:
  build:
    name: MacRDP
    runs-on: macos-latest
    
    steps:
    # 1. Tailscale CLI इंस्टॉल और कनेक्ट करना
    - name: Install and Connect to Tailscale
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        echo "Installing Tailscale..."
        brew install tailscale
        sudo brew services start tailscale
        sleep 5
        sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --ssh

    # 2. स्क्रीन शेयरिंग (VNC) ऑन करना और नया यूजर बनाना
    - name: Force Enable macOS Screen Sharing
      run: |
        echo "Configuring Screen Sharing..."
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -allowAccessFor -allUsers -privs -all
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvnclegacy -vnclegacy yes
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvncpw -vncpw Secret12
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent
        
        echo "Creating a new admin user for VNC login..."
        # 'runner' का पासवर्ड बदलने के बजाय, हम 'vncuser' नाम का एक नया एडमिन अकाउंट बना रहे हैं
        sudo sysadminctl -addUser vncuser -fullName "VNC Admin" -password "Password123" -admin
        
        echo "Screen Sharing successfully started!"

    # 3. IP एड्रेस दिखाना
    - name: Get Tailscale IP
      run: |
        echo "Your Machine Tailscale IP is:"
        tailscale ip -4

    # 4. सेशन को चालू रखना
    - name: Keep Alive via tmate
      uses: mxschmitt/action-tmate@v3
