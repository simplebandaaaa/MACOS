name: MacRDP-Tailscale
on: 
  workflow_dispatch:

jobs:
  build:
    name: MacRDP
    runs-on: macos-latest
    
    steps:
    # 1. Homebrew के जरिए Tailscale CLI इंस्टॉल करना
    - name: Install and Connect to Tailscale
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        echo "Installing Tailscale via Homebrew..."
        # CLI वर्जन इंस्टॉल करने के लिए tailscale-cli का उपयोग करें
        brew install tailscale
        
        echo "Starting Tailscale Daemon..."
        # macOS पर टेलस्केल बैकग्राउंड सर्विस को शुरू करना
        sudo brew services start tailscale
        
        # थोड़ा रुकें ताकि बैकग्राउंड सर्विस ठीक से स्टार्ट हो जाए
        sleep 5
        
        echo "Authenticating Tailscale..."
        # अब 'tailscale' कमांड काम करेगी
        sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --ssh

    # 2. macOS Screen Sharing (VNC/RDP) को इनेबल करना
    - name: Enable macOS Screen Sharing
      run: |
        echo "Configuring macOS Screen Sharing..."
        sudo launchctl kickstart -k system/com.apple.screensharing
        
        # runner यूजर के लिए पासवर्ड सेट करना
        sudo dscl . -passwd /Users/runner Password123
        echo "Screen Sharing is enabled. User: runner, Password: Password123"

    # 3. GitHub Runner के IP को Tailscale नेटवर्क पर दिखाना
    - name: Get Tailscale IP
      run: |
        echo "Your Machine Tailscale IP is:"
        tailscale ip -4

    # 4. Session को चालू रखना (tmate के जरिए)
    - name: Keep Alive via tmate
      uses: mxschmitt/action-tmate@v3
